[project]
name = "agentic-gan"
version = "0.1.0"
description = "Agentic GAN framework for synthetic data augmentation (Columbia DS Capstone x TD Bank, Team 23)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "catboost>=1.2.10",
    "ctgan>=0.12.1",
    "imbalanced-learn>=0.14.2",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "sdv>=1.32.1",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
    "statsmodels>=0.15.0",
    "ucimlrepo>=0.0.7",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_gan"]

[tool.uv]
default-groups = ["dev", "notebooks"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
notebooks = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "skimpy>=0.0.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["eda"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
